# Project metadata and dependencies for Chef Helper.
# Managed with uv: add packages with `uv add <name>` (or `uv add --dev <name>`
# for test-only tools) rather than editing the lists by hand; uv pins exact
# versions in uv.lock.

[project]
name = "chef-helper"
version = "0.0.7"
description = "Household kitchen assistant: cook log, ratings, approximate inventory, and recipe suggestions alongside Mealie."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.156.4",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
# Tests import the app as `app.*` from the repo root.
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
