{% extends "base.html" %}
{% block title %}Log in · Chef Helper{% endblock %}
{% block content %}
<article>
  <h2>Log in</h2>
  {% if error %}<p class="notice error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next_path }}">
    <label>Username
      <input name="username" autocomplete="username" autocapitalize="none" required value="{{ username or '' }}">
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
  <p class="meta">New here? <a href="/signup">Create an account</a></p>
</article>
{% endblock %}
