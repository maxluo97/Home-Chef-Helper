{% extends "base.html" %}
{% block title %}Sign up · Chef Helper{% endblock %}
{% block content %}
<article>
  <h2>Create an account</h2>
  {% if error %}<p class="notice error">{{ error }}</p>{% endif %}
  <form method="post" action="/signup">
    <label>Your name
      <input name="display_name" required maxlength="100" placeholder="e.g. Max" value="{{ display_name or '' }}">
    </label>
    <label>Username
      <input name="username" autocomplete="username" autocapitalize="none" required
             minlength="3" maxlength="32" value="{{ username or '' }}">
      <small>3–32 characters: letters, digits, dot, underscore, or hyphen.</small>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
      <small>At least 8 characters.</small>
    </label>
    <button type="submit">Sign up</button>
  </form>
  <p class="meta">Already have an account? <a href="/login">Log in</a></p>
</article>
{% endblock %}
